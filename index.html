  else if(r.b&&r.text&&r.text.length>25){const w=(r.text.match(/[A-Za-z\u00C0-\u024F]{6,}/g)||[]).sort((x,y)=>y.length-x.length)[0];
   cards.push({id:r.id,q:w?r.text.replace(w,"_____"):"Recall this passage.",a:r.text,src:T[r.b]||"Highlight"})}});
 const due=cards.filter(c=>!st["rv"+c.id]||st["rv"+c.id].due<=today()).sort(()=>Math.random()-.5).slice(0,25);let i=0,seen=0;
 const head='<div class="hd" style="padding:18px 0 10px;'+WRAP+'"><button class="lk" id="xb">Library</button><h1>Study</h1><span></span></div>';
 const back=()=>{show("lib");shelf()};
 const draw=rev=>{const ex=$("#ex");
  if(i>=due.length){ex.innerHTML=head+'<div style="'+WRAP+'"><div class="em">'+(cards.length?(seen?"All done for now. You reviewed "+seen+(seen>1?" cards.":" card.")+" Come back tomorrow.":"Nothing is due today."):"No cards yet. Add glossary terms or technique cards, or highlight passages while reading.")+"</div></div>";$("#xb").onclick=back;return}
  const c=due[i];ex.innerHTML=head+'<div style="'+WRAP+'"><div class="dg" style="padding:0 0 10px">'+(due.length-i)+" due. "+esc(c.src)+'</div><div class="card" style="white-space:pre-wrap">'+esc(rev?c.a:c.q)+"</div>"+
   (rev?'<div style="display:flex;gap:12px"><button class="pb" id="ag" style="background:none;color:var(--acc);border:1px solid var(--acc)">Again</button><button class="pb" id="gd">Good</button></div>':'<button class="pb" id="sa">Show answer</button>')+"</div>";
  $("#xb").onclick=back;
  if(!rev)$("#sa").onclick=()=>draw(1);
  else{const grade=async ok=>{const k="rv"+c.id,o=st[k]||{id:k,rv:1,box:0};o.box=ok?Math.min(o.box+1,GAP.length-1):0;o.due=addDays(ok?GAP[o.box]:1);st[k]=o;await DB.put("marks",o);seen++;if(!ok)due.push(c);i++;draw(0)};
   $("#ag").onclick=()=>grade(0);$("#gd").onclick=()=>grade(1)}};
 draw(0)}
/* Teaching: students, lesson plans, handouts. Its own store, separate from Library and Clients */
function idb(name,stores){let p;const open=()=>p||(p=new Promise((res,rej)=>{const r=indexedDB.open(name,1);r.onupgradeneeded=()=>stores.forEach(n=>r.result.createObjectStore(n,{keyPath:"id"}));r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)}));
 const tx=async(s,m,f)=>{const d=await open();return new Promise((res,rej)=>{const t=d.transaction(s,m);const o=f(t);t.oncomplete=()=>res(o&&o.result);t.onerror=()=>rej(t.error)})};
 return{all:s=>tx(s,"readonly",t=>t.objectStore(s).getAll()),put:(s,v)=>tx(s,"readwrite",t=>{t.objectStore(s).put(v)}),del:(s,k)=>tx(s,"readwrite",t=>{t.objectStore(s).delete(k)})}}
const TDB=idb("stillpoint-teaching",["rec"]);
const tcoll=(k,more)=>Object.assign({back:["Home",()=>show("home")],tab:t=>teach(t),
 list:async()=>(await TDB.all("rec")).filter(r=>r.k===k),put:r=>TDB.put("rec",r),del:id=>TDB.del("rec",id),
 head:()=>'<div class="lkr" style="padding:0 0 8px">'+[["students","Students"],["lessons","Lesson plans"],["handouts","Handouts"]].map(t=>'<button class="lk" data-t="'+t[0]+'"'+(t[0]===k?' style="font-weight:700"':"")+">"+t[1]+"</button>").join("")+'<button class="lk" id="tbk" style="color:var(--soft)">Back up</button><label class="lk" style="cursor:pointer;color:var(--soft)">Restore<input id="trs" type="file" accept=".json,application/json" hidden></label></div>'},more);
const TK={
 students:()=>tcoll("students",{title:"Teaching",empty:"No students yet. Add first names only.",fields:[["name","First name"],["hours","Practice hours logged","number"],["classes","Classes attended","number"],["notes","Notes","area"]],mk:()=>({id:"st"+Date.now(),k:"students"}),
  row:r=>[r.name,(r.hours||0)+" practice hours, "+(r.classes||0)+(r.classes===1?" class":" classes")],list:async()=>(await TDB.all("rec")).filter(r=>r.k==="students").sort((a,b)=>a.name.localeCompare(b.name))}),
 lessons:()=>tcoll("lessons",{title:"Teaching",empty:"No lesson plans yet. Outline a class with its timing and materials.",fields:[["title","Lesson title"],["date","Date","date"],["minutes","Length in minutes","number"],["outline","Outline","area"],["materials","Materials","area"]],mk:()=>({id:"ls"+Date.now(),k:"lessons",date:today(),minutes:90}),
  row:r=>[r.title,(r.date?fd(r.date)+", ":"")+(r.minutes||0)+" min"],list:async()=>(await TDB.all("rec")).filter(r=>r.k==="lessons").sort((a,b)=>(b.date||"").localeCompare(a.date||""))}),
 handouts:()=>tcoll("handouts",{title:"Teaching",empty:"No handouts yet. Write one, then make it a PDF to share.",fields:[["title","Title"],["body","Text","area"]],mk:()=>({id:"ho"+Date.now(),k:"handouts"}),
  row:r=>[r.title,(r.body||"").slice(0,80)],list:async()=>(await TDB.all("rec")).filter(r=>r.k==="handouts").sort((a,b)=>a.title.localeCompare(b.title)),actions:[["Make PDF",r=>handout(r)]]})};
async function teach(k){await coll(TK[k||"students"]());
 $("#tbk").onclick=async()=>saveFile("stillpoint-teaching-"+stamp()+".json",JSON.stringify({app:"stillpoint",kind:"teaching",v:1,rec:await TDB.all("rec")}));
 $("#trs").onchange=async e=>{const f=e.target.files[0];e.target.value="";if(!f)return;try{const j=JSON.parse(await f.text());if(j.kind!=="teaching")throw 0;for(const r of j.rec)await TDB.put("rec",r);toast("Teaching restored.");teach(k)}catch(x){toast("That is not a Stillpoint teaching backup.")}}}
async function handout(r){try{toast("Preparing PDF\u2026");await loadJs("vendor/jspdf.umd.min.js");const d=new jspdf.jsPDF({unit:"pt",format:"a4"}),W=d.internal.pageSize.getWidth(),H=d.internal.pageSize.getHeight(),M=56;let y=M;
 d.setFont("times","normal");d.setFontSize(24);for(const l of d.splitTextToSize(r.title,W-2*M)){d.text(l,M,y+24);y+=32}y+=10;d.setFontSize(12);
 for(const l of d.splitTextToSize(r.body||"",W-2*M)){if(y+18>H-M){d.addPage();y=M;d.setFont("times","normal");d.setFontSize(12)}d.text(l,M,y+12);y+=18}
 await saveFile("handout-"+r.title.replace(/[^\w-]+/g,"-")+".pdf",d.output("blob"))}catch(e){toast("Could not make the PDF.")}}
$("#d3").onclick=()=>teach("students");
if(navigator.storage&&navigator.storage.persist)navigator.storage.persist().catch(()=>{});
if("serviceWorker" in navigator)addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));
home();
</script>
